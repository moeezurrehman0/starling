# Publish: push, attest, sign.
#
# Runs on main, for the five service images. Main is branch-protected and the `CI` check is
# required, so anything that reaches this workflow has already been built, tested, scanned
# and driven through a browser. This is the trust boundary of the whole delivery system, so
# it is worth being explicit about what it does and does not have:
#
#   HAS     packages:write (push to GHCR) and id-token:write (keyless signing).
#   HAS NOT any cluster credential, any kubeconfig, any kubectl. A compromise of this
#           workflow can publish a bad image. It cannot deploy one. ArgoCD pulls; CI never
#           pushes to a cluster.
#
# The remaining handoff step from docs/02-workflow.md -- a bot commit bumping the image tag
# in deploy/envs/dev/ -- is the `bump` job at the bottom of this file. It was deferred until
# Phase 7 brought the manifests it edits, and then it stayed deferred after they arrived:
# the note explaining the wait outlived the thing it was waiting for. The cost of that is in
# docs/16-gap-register.md S65 -- every dev manifest kept the chart's placeholder tag and a
# registry namespace that does not exist, and because every other consumer overrides the
# image reference, only ArgoCD ever read it.
#
# Registry note: docs/02-workflow.md specifies ECR, and that remains the target for Tier S
# and Tier P. ECR needs an AWS account and an OIDC trust policy, which are Phase 8. GHCR is
# the stand-in until then and is a true stand-in, not a shortcut -- it is OCI, it takes the
# same cosign signature and the same referrer-attached SBOM, so the switch is a registry
# host and a login step, not a redesign.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # See ci.yml: the called workflow needs pull-requests to read a PR's file list,
    # and a caller that does not grant it fails the run before any job starts.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  publish:
    name: Publish (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - run: ./gradlew :services:${{ matrix.service }}:bootJar

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # sha-<short> and nothing else. No `latest`, ever: a mutable tag makes "what is
          # running in dev right now?" a question with no answer, and makes a rollback a
          # guess. The deploy manifest carries the immutable tag, so the git history of
          # deploy/ *is* the deployment history.
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_FILE=services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Provenance and SBOM as OCI referrers, generated by BuildKit from what it
          # actually assembled rather than by a scanner guessing afterwards. This is
          # strictly better evidence than a Syft pass over the finished image, because
          # BuildKit knows the build graph.
          provenance: mode=max
          sbom: true

      # The push above reports success from the builder's point of view. This asks the
      # registry instead, which is the only party whose answer matters -- the tag has to
      # resolve, and to the digest we just pushed. See S60: this workflow reported
      # success twice on a repository where it had never once pushed an image, because a
      # skipped matrix job and a completed one are the same green tick.
      - name: Verify the image resolves in the registry
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: ./scripts/image-digest-verify.sh

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cdx.json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Keyless. The signing identity is this workflow's OIDC token, so the signature
        # says "built by .github/workflows/publish.yml on refs/heads/main of this
        # repository" -- a fact a stolen key cannot assert. There is no key to rotate and
        # nothing in secrets to leak.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Attaching the SBOM to the digest, rather than only uploading it as a build
        # artefact, is what makes it useful at admission time: a cluster policy can ask the
        # registry for the bill of materials of the exact image it is about to run.
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

  # The frontend, which the JVM matrix cannot carry: it has no bootJar and a different
  # Dockerfile. It was left out of this workflow entirely, so `deploy/envs/dev/web.yaml`
  # referenced an image that was never built by anything -- ArgoCD had nothing to pull.
  # Same REBUILD_ALL rule as the matrix: a change to the pipeline or to the image
  # tooling invalidates the `web/**` filter, so it must rebuild.
  publish-web:
    name: Publish (web)
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/web:sha-${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

      - name: Verify the image resolves in the registry
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web:sha-${{ github.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: ./scripts/image-digest-verify.sh

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The digest read-back above verifies nothing in the case that caused S60. It runs
  # inside the matrix job, and a job that never ran cannot fail its own assertion --
  # so a service dropped by the path filter still publishes nothing and still reports
  # success. This job is outside the matrix and outside the path filter, so it is the
  # one thing here that a skip cannot silence. See docs/16-gap-register.md S61.
  verify:
    name: Verify the matrix published what it selected
    needs: [changes, publish]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Reading a public package needs no token, but these are only public by a
      # setting someone could change; logging in makes the check independent of it.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every selected service reached the registry
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          MATRIX_RESULT: ${{ needs.publish.result }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: ./scripts/publish-verify.sh

  # The GitOps handoff: CI knows which images it just published, ArgoCD knows how to
  # deploy what is committed, and this job is the only thing that connects them.
  #
  # It is the one job here with contents:write, so the blast radius is worth stating. It
  # can write to deploy/envs/dev/ on main and nothing else -- the script rewrites a `tag:`
  # line in a fixed directory and refuses anything it cannot map to an image it was told
  # was published. It still has no cluster credential; ArgoCD pulls this commit, CI does
  # not push to a cluster.
  #
  # No loop protection is needed, and that is by construction rather than by luck. This
  # job only ever touches deploy/**, and deploy/** appears in none of the filters that
  # select work here: `services` comes from services/**, and REBUILD_ALL from docker/**,
  # scripts/** and .github/workflows/**. So the commit it makes re-runs this workflow with
  # an empty matrix and no web build, the bump finds nothing to do, and it stops. CI does
  # run on deploy/** -- deliberately, because a manifest change should be linted.
  bump:
    name: Bump dev image tags
    needs: [changes, publish, publish-web, verify]
    # `verify` is the gate: it fails if the matrix skipped something it selected, and
    # bumping a tag on the strength of a job that quietly did nothing is the exact class
    # of false green this workflow exists to prevent. The skipped() cases below are the
    # ordinary ones -- only backend changed, or only the frontend did.
    if: >-
      needs.verify.result == 'success' &&
      (needs.publish.result == 'success' || needs['publish-web'].result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the tags for whatever was just published
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          WEB_PUBLISHED: ${{ needs['publish-web'].result == 'success' }}
          SHA: ${{ github.sha }}
        run: ./scripts/deploy-bump-tags.sh

      - name: Assert the result is deployable before committing it
        run: ./scripts/deploy-bump-tags.sh --check

      - name: Commit
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet -- deploy/envs/dev; then
            echo "Nothing to bump: every tag already points at ${SHA}."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/envs/dev
          git commit -m "chore: bump dev image tags to ${SHA:0:7}" \
                     -m "Published by ${GITHUB_RUN_ID}. Generated by scripts/deploy-bump-tags.sh."

          # Two publishes finishing close together race for the same ref. Rebase and retry
          # rather than force -- losing a bump is recoverable, overwriting someone else's
          # commit on main is not.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected; rebasing onto main and retrying (attempt ${attempt})."
            git pull --rebase origin main
          done

          echo "::error::Could not push the tag bump after three attempts. deploy/envs/dev" \
               "is now behind the registry, so ArgoCD is serving the previous image. Re-run" \
               "this job once main is quiet."
          exit 1
