# Publish: push, attest, sign.
#
# Runs on main, for the five service images. Main is branch-protected and the `CI` check is
# required, so anything that reaches this workflow has already been built, tested, scanned
# and driven through a browser. This is the trust boundary of the whole delivery system, so
# it is worth being explicit about what it does and does not have:
#
#   HAS     packages:write (push to GHCR) and id-token:write (keyless signing).
#   HAS NOT any cluster credential, any kubeconfig, any kubectl. A compromise of this
#           workflow can publish a bad image. It cannot deploy one. ArgoCD pulls; CI never
#           pushes to a cluster.
#
# The remaining handoff step from docs/02-workflow.md -- a bot commit bumping the image tag
# in deploy/envs/dev/ -- is the `bump` job at the bottom of this file. It was deferred until
# Phase 7 brought the manifests it edits, and then it stayed deferred after they arrived:
# the note explaining the wait outlived the thing it was waiting for. The cost of that is in
# docs/16-gap-register.md S65 -- every dev manifest kept the chart's placeholder tag and a
# registry namespace that does not exist, and because every other consumer overrides the
# image reference, only ArgoCD ever read it.
#
# Registry note: docs/02-workflow.md specifies ECR, and that remains the target for Tier S
# and Tier P. ECR needs an AWS account and an OIDC trust policy, which are Phase 8. GHCR is
# the stand-in until then and is a true stand-in, not a shortcut -- it is OCI, it takes the
# same cosign signature and the same referrer-attached SBOM, so the switch is a registry
# host and a login step, not a redesign.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # See ci.yml: the called workflow needs pull-requests to read a PR's file list,
    # and a caller that does not grant it fails the run before any job starts.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  # The jars are built once, here, and not once per architecture. That is partly
  # thrift -- a Gradle build on an arm64 runner costs the same as on amd64 and
  # would buy nothing -- but mostly correctness: a boot jar is architecture
  # independent, and building it twice means the amd64 and arm64 images under
  # one tag could contain byte-different jars from two different compilations.
  # A manifest list is supposed to be one artefact in two shapes.
  jars:
    name: Jar (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - run: ./gradlew :services:${{ matrix.service }}:bootJar

      - uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish (${{ matrix.service }}, ${{ matrix.arch }})
    needs: [changes, jars]
    if: needs.changes.outputs.services != '[]'
    # Native runners, one per architecture, rather than one runner emulating the
    # other. QEMU was considered and rejected on measurement: docker/Dockerfile
    # runs jlink and a full Spring context refresh to train the CDS archive, and
    # foreign-architecture interpretation of that kind of work costs an order of
    # magnitude. `ubuntu-24.04-arm` is free for public repositories, which this
    # is; on a private repository this choice would need re-costing.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          name: jar-${{ matrix.service }}
          path: services/${{ matrix.service }}/build/libs

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          # No tag here. Each architecture is pushed as an untagged image and
          # identified only by its digest; the merge job below joins them under
          # the one tag. Tagging both would mean the second push silently won
          # and the tag meant whichever job finished last.
          #
          # The tag, when it is finally applied, is sha-<sha> and nothing else.
          # No `latest`, ever: a mutable tag makes "what is running in dev right
          # now?" a question with no answer, and makes a rollback a guess. The
          # deploy manifest carries the immutable tag, so the git history of
          # deploy/ *is* the deployment history.
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }},
            push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_FILE=services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
            GIT_SHA=${{ github.sha }}
          # Scoped per architecture. A shared scope would have the two runners
          # overwrite each other's cache every run, so neither would ever hit --
          # which matters more now than it did, because arm64 is the slow half.
          cache-from: type=gha,scope=${{ matrix.service }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-${{ matrix.arch }}
          # Provenance and SBOM as OCI referrers, generated by BuildKit from what it
          # actually assembled rather than by a scanner guessing afterwards. This is
          # strictly better evidence than a Syft pass over the finished image, because
          # BuildKit knows the build graph.
          provenance: mode=max
          sbom: true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          printf '%s' '${{ steps.push.outputs.digest }}' > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  # Where the tag is created, and the only place that knows what a complete
  # publish looks like. See scripts/manifest-merge.sh for why the platform set
  # is asserted here rather than trusted: S69 shipped amd64-only images past a
  # digest read-back, an out-of-matrix verify job and a cosign signature, all
  # three of which were telling the truth about the wrong question.
  merge:
    name: Merge and sign (${{ matrix.service }})
    needs: [changes, publish]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          pattern: digest-${{ matrix.service }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and assert its platforms
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          TAG: sha-${{ github.sha }}
          DIGEST_DIR: /tmp/digests
        run: ./scripts/manifest-merge.sh

      # The merge above reports success from the client's point of view. This asks the
      # registry instead, which is the only party whose answer matters -- the tag has to
      # resolve, and to the digest we just created. See S60: this workflow reported
      # success twice on a repository where it had never once pushed an image, because a
      # skipped matrix job and a completed one are the same green tick.
      - name: Verify the image resolves in the registry
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: ./scripts/image-digest-verify.sh

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.merge.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cdx.json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        # The LIST digest, not either architecture's. Signing the per-arch
        # images would leave the thing a deployment actually pulls -- the tag,
        # which resolves to the list -- unsigned, while every individual
        # verification passed.
        #
        # Keyless. The signing identity is this workflow's OIDC token, so the signature
        # says "built by .github/workflows/publish.yml on refs/heads/main of this
        # repository" -- a fact a stolen key cannot assert. There is no key to rotate and
        # nothing in secrets to leak.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        # Attaching the SBOM to the digest, rather than only uploading it as a build
        # artefact, is what makes it useful at admission time: a cluster policy can ask the
        # registry for the bill of materials of the exact image it is about to run.
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

  # The frontend, which the JVM matrix cannot carry: it has no bootJar and a different
  # Dockerfile. It was left out of this workflow entirely, so `deploy/envs/dev/web.yaml`
  # referenced an image that was never built by anything -- ArgoCD had nothing to pull.
  # Same REBUILD_ALL rule as the matrix: a change to the pipeline or to the image
  # tooling invalidates the `web/**` filter, so it must rebuild.
  publish-web:
    name: Publish (web, ${{ matrix.arch }})
    needs: changes
    if: >-
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Unlike the JVM services there is no shared build artefact to hoist: the
      # Next.js output is produced inside the image and `npm ci` resolves
      # architecture-specific optional dependencies, so this one genuinely has
      # to run twice.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/${{ matrix.arch }}
          outputs: >-
            type=image,
            name=${{ env.REGISTRY }}/${{ github.repository }}/web,
            push-by-digest=true,name-canonical=true,push=true
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          printf '%s' '${{ steps.push.outputs.digest }}' > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-web-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  merge-web:
    name: Merge and sign (web)
    needs: [changes, publish-web]
    if: >-
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v6
        with:
          pattern: digest-web-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list and assert its platforms
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web
          TAG: sha-${{ github.sha }}
          DIGEST_DIR: /tmp/digests
        run: ./scripts/manifest-merge.sh

      - name: Verify the image resolves in the registry
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web:sha-${{ github.sha }}
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: ./scripts/image-digest-verify.sh

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/web
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The digest read-back above verifies nothing in the case that caused S60. It runs
  # inside the matrix job, and a job that never ran cannot fail its own assertion --
  # so a service dropped by the path filter still publishes nothing and still reports
  # success. This job is outside the matrix and outside the path filter, so it is the
  # one thing here that a skip cannot silence. See docs/16-gap-register.md S61.
  verify:
    name: Verify the matrix published what it selected
    needs: [changes, merge]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Reading a public package needs no token, but these are only public by a
      # setting someone could change; logging in makes the check independent of it.
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert every selected service reached the registry
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          # `merge`, not `publish`: the tag this asserts on does not exist until
          # the manifest list is created, so a publish that succeeded per
          # architecture and then failed to merge must read as a failure here.
          MATRIX_RESULT: ${{ needs.merge.result }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ github.repository }}
          SHA: ${{ github.sha }}
        run: ./scripts/publish-verify.sh

  # The GitOps handoff: CI knows which images it just published, ArgoCD knows how to
  # deploy what is committed, and this job is the only thing that connects them.
  #
  # It opens a pull request; it does not push. The first version of this job pushed
  # straight to main and was refused by the branch ruleset -- "Changes must be made
  # through a pull request" -- after the job had already been merged and described, in
  # its own commit message, as understood. The script had 17 passing cases behind it. The
  # script was never the part that broke. See docs/16-gap-register.md S68.
  #
  # Opening a PR is also the better design, not merely the permitted one: the bumped
  # manifests go through the same helm-lint and schema checks as any hand-written change,
  # and the commit that ArgoCD will deploy is reviewable before it is deployable.
  #
  # No loop protection is needed, and that is by construction rather than by luck. This
  # job only ever touches deploy/**, and deploy/** appears in none of the filters that
  # select work here: `services` comes from services/**, and REBUILD_ALL from docker/**,
  # scripts/** and .github/workflows/**. So merging its PR re-runs this workflow with an
  # empty matrix and no web build, the bump finds nothing to do, and it stops. CI does run
  # on deploy/** -- deliberately, because a manifest change should be linted.
  bump:
    name: Bump dev image tags
    needs: [changes, merge, merge-web, verify]
    # `verify` is the gate: it fails if the matrix skipped something it selected, and
    # bumping a tag on the strength of a job that quietly did nothing is the exact class
    # of false green this workflow exists to prevent. The skipped() cases below are the
    # ordinary ones -- only backend changed, or only the frontend did.
    if: >-
      needs.verify.result == 'success' &&
      (needs.merge.result == 'success' || needs['merge-web'].result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Rewrite the tags for whatever was just published
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          WEB_PUBLISHED: ${{ needs['merge-web'].result == 'success' }}
          SHA: ${{ github.sha }}
        run: ./scripts/deploy-bump-tags.sh

      - name: Assert the result is deployable before proposing it
        run: ./scripts/deploy-bump-tags.sh --check

      - name: Open a pull request with the bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          if git diff --quiet -- deploy/envs/dev; then
            echo "Nothing to bump: every tag already points at ${SHA}."
            exit 0
          fi

          short="${SHA:0:7}"
          branch="automation/dev-image-tags-${short}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add deploy/envs/dev
          git commit -m "chore: bump dev image tags to ${short}" \
                     -m "Published by run ${RUN_ID}. Generated by scripts/deploy-bump-tags.sh."

          # A per-SHA branch is always new, so this push is always a fast-forward and
          # never needs --force. Two publishes cannot collide on it.
          git push origin "$branch"

          cat > /tmp/bump-body.md <<EOF
          Generated by scripts/deploy-bump-tags.sh from Publish run ${RUN_ID}.

          Every tag here points at an image that the same run pushed and that
          publish-verify.sh then re-read back from the registry. The --check mode has
          already asserted that no placeholder tag and no dead registry namespace
          survives in deploy/envs/dev.

          Merging this is what actually deploys: ArgoCD syncs deploy/envs/dev from main.
          EOF

          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: bump dev image tags to ${short}" \
            --body-file /tmp/bump-body.md

          # Older bump PRs are superseded the moment this one exists -- they would deploy
          # an image that is no longer current. Leaving them open invites merging the
          # wrong one later, which is a rollback nobody asked for.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("automation/dev-image-tags-")) | select(.headRefName != "'"$branch"'") | .number' \
          | while read -r old; do
              echo "Closing superseded bump PR #${old}."
              gh pr close "$old" --comment "Superseded by the bump for ${short}." --delete-branch
            done
