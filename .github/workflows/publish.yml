# Publish: push, attest, sign.
#
# Runs on main, for the five service images. Main is branch-protected and the `CI` check is
# required, so anything that reaches this workflow has already been built, tested, scanned
# and driven through a browser. This is the trust boundary of the whole delivery system, so
# it is worth being explicit about what it does and does not have:
#
#   HAS     packages:write (push to GHCR) and id-token:write (keyless signing).
#   HAS NOT any cluster credential, any kubeconfig, any kubectl. A compromise of this
#           workflow can publish a bad image. It cannot deploy one. ArgoCD pulls; CI never
#           pushes to a cluster.
#
# The remaining handoff step from docs/02-workflow.md -- a bot commit bumping the image tag
# in deploy/envs/dev/ -- lands in Phase 7 with the manifests it would edit. Adding it now
# would mean granting contents:write for a directory that does not exist.
#
# Registry note: docs/02-workflow.md specifies ECR, and that remains the target for Tier S
# and Tier P. ECR needs an AWS account and an OIDC trust policy, which are Phase 8. GHCR is
# the stand-in until then and is a true stand-in, not a shortcut -- it is OCI, it takes the
# same cosign signature and the same referrer-attached SBOM, so the switch is a registry
# host and a login step, not a redesign.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    # See ci.yml: the called workflow needs pull-requests to read a PR's file list,
    # and a caller that does not grant it fails the run before any job starts.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/changes.yml

  publish:
    name: Publish (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - run: ./gradlew :services:${{ matrix.service }}:bootJar

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # sha-<short> and nothing else. No `latest`, ever: a mutable tag makes "what is
          # running in dev right now?" a question with no answer, and makes a rollback a
          # guess. The deploy manifest carries the immutable tag, so the git history of
          # deploy/ *is* the deployment history.
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_FILE=services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          # Provenance and SBOM as OCI referrers, generated by BuildKit from what it
          # actually assembled rather than by a scanner guessing afterwards. This is
          # strictly better evidence than a Syft pass over the finished image, because
          # BuildKit knows the build graph.
          provenance: mode=max
          sbom: true

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}@${{ steps.push.outputs.digest }}
          format: cyclonedx-json
          artifact-name: sbom-${{ matrix.service }}.cdx.json
          output-file: sbom-${{ matrix.service }}.cdx.json

      - uses: sigstore/cosign-installer@v3

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Keyless. The signing identity is this workflow's OIDC token, so the signature
        # says "built by .github/workflows/publish.yml on refs/heads/main of this
        # repository" -- a fact a stolen key cannot assert. There is no key to rotate and
        # nothing in secrets to leak.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest the SBOM
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          DIGEST: ${{ steps.push.outputs.digest }}
        # Attaching the SBOM to the digest, rather than only uploading it as a build
        # artefact, is what makes it useful at admission time: a cluster policy can ask the
        # registry for the bill of materials of the exact image it is about to run.
        run: |
          cosign attest --yes \
            --predicate "sbom-${{ matrix.service }}.cdx.json" \
            --type cyclonedx \
            "${IMAGE}@${DIGEST}"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90
