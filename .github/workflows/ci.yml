# The pipeline.
#
# One workflow, so that a pull request shows one answer rather than nine independently-red
# checks whose relationship nobody can reconstruct. Jobs are path-filtered off `changes`
# and skip cleanly; the final `verdict` job is the single required check, and it fails if
# anything it depends on failed *or was cancelled*, which a plain `needs:` does not.
#
# What is deliberately NOT here: deployment. Nothing in this file touches AWS. Promotion is
# ArgoCD's job (Phase 7) and provisioning is Terraform's (Phases 8-9); a CI pipeline that
# also deploys is how a test failure becomes an outage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on a branch, but never on main -- a main run produces the SBOM and
# the signature for a commit that is already merged, and cancelling it leaves a released
# artefact unattested.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  # --------------------------------------------------------------------------
  # Fast feedback. These run on every change that touches code, and they are
  # the checks most likely to fail, so they come first and independently.
  # --------------------------------------------------------------------------

  java:
    name: Java
    needs: changes
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only main writes the cache. A pull request that can poison the cache read by
          # main is a supply-chain hole, and a fork PR cannot write it anyway.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      # One invocation, and `build` rather than a split fast/slow pair. The split is
      # tempting -- a red "Unit tests" reads very differently from a red "Integration
      # tests" -- but the coverage gate in starling.java-conventions deliberately counts
      # both suites together, so `check` depends on `integrationTest` regardless. Splitting
      # would therefore run the Testcontainers suite twice, once in each job, to buy a
      # nicer job name. The task name in the failure output already carries that signal.
      #
      # Docker is present on the runner, which is what the LocalStack and PostgreSQL
      # containers need; no service containers are declared because Testcontainers manages
      # its own lifecycle and a declared service would be a second, divergent definition of
      # the same dependency.
      - run: ./gradlew build
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-reports
          path: |
            services/*/build/reports/**
            services/*/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` and not `npm install`: the lockfile is the input, and a job that is allowed
      # to resolve a different tree than a developer did is not testing what ships.
      - run: npm ci
      - run: npm run lint
      # `next build` type-checks the whole tsconfig include, which covers the Playwright
      # specs as well -- so a spec that no longer compiles against the app's own types fails
      # here, in seconds, rather than in the e2e job twenty minutes later.
      - run: npm run build

  # --------------------------------------------------------------------------
  # Security. Independent of the build, because a secret in the history or a
  # vulnerable dependency matters whether or not the code compiles.
  # --------------------------------------------------------------------------

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, so a shallow clone would only ever find a secret
          # committed in the last commit -- which is the one case a pre-commit hook already
          # catches.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  scripts:
    name: Scripts
    needs: changes
    # scripts/ is covered by the docker filter and tools/ by the compose filter, because
    # that is where each is consumed; both feed this job.
    if: >-
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.compose == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sandbox probe runs exactly once per 180-minute KodeKloud session against an
      # account nobody can reproduce, so a bug in it costs the session. It is tested here
      # instead, against a stubbed AWS CLI -- which is how the subshell bug that made every
      # capability report a confident, blank-reasoned NO was found.
      - name: Probe self-test
        run: ./scripts/probe-selftest.sh

      # Same argument, higher stakes. The three sandbox lifecycle scripts run once
      # per session, and `sandbox-down` carries the project's done criterion --
      # "leaves nothing". That claim is only as good as the verification sweep, and
      # a sweep has two opposite ways to be wrong: reporting clean because a query
      # was denied, and reporting dirty because AWS printed the literal string
      # "None" for an empty result. Both are asserted against stub binaries here.
      - name: Sandbox lifecycle self-test
        run: ./scripts/sandbox-selftest.sh

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/*.sh tools/*.sh

  # ---------------------------------------------------------------------------
  # The gap register is this project's headline deliverable, and its own
  # maintenance section states that a row naming an artefact which does not
  # exist is a bug rather than a plan. That rule was written down and never
  # enforced, which is how two comments in the source tree came to point at the
  # wrong entry: the register table (1-27) and the silent-failure classes
  # (S1-S41) were two numbering schemes, both cited as "gap row N".
  #
  # Deliberately unfiltered. A dead citation can be introduced from `deploy/`,
  # `load/`, `tools/`, `services/` or `docs/` -- anywhere a comment can be
  # written -- so a path filter here would be a gate that is absent exactly when
  # it is needed. The script is grep-only and takes about a second.
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/gap-verify.sh

      # A Mermaid syntax error does not fail anything. GitHub renders the block
      # as an inert grey box and says nothing, so the README's lead diagram --
      # the first thing any reader sees -- can break on a one-character edit and
      # stay broken indefinitely. Rendering each diagram is the only way to find
      # out, and it costs about a minute. Negative-tested against a deliberately
      # malformed node.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagrams parse
        run: |
          npm install --no-save @mermaid-js/mermaid-cli
          # mermaid-cli renders through headless Chromium. Ubuntu 23.10+ blocks
          # unprivileged user namespaces via AppArmor, so the browser dies with
          # "No usable sandbox!" before it ever reads a diagram. This is safe
          # here and only here: the input is five .mmd files from this repo, not
          # untrusted content.
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox"]}' > /tmp/pptr.json
          for f in docs/diagrams/*.mmd; do
            printf '%-28s ' "$(basename "$f")"
            npx mmdc -p /tmp/pptr.json -i "$f" -o "/tmp/$(basename "$f").svg" >/tmp/mmd.log 2>&1 \
              && echo OK || { echo FAIL; tail -20 /tmp/mmd.log; exit 1; }
          done

  helm:
    name: Helm
    needs: changes
    if: >-
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      # Pinned, and installed from the release rather than an action, because the
      # schema set a validator uses is the thing being trusted here -- an
      # unpinned version can start passing manifests it used to reject.
      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/kc.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kc.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # PyYAML happens to be preinstalled on ubuntu-latest, which is exactly why
      # it is pinned here: an undeclared dependency that works by luck breaks on
      # the runner image bump, and the failure surfaces as chart errors rather
      # than as a missing module.
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Renders every service in every environment and schema-checks the result,
      # then asserts the invariants a schema cannot see: no HPA fighting a
      # hardcoded replica count, no PDB that blocks drain, the two Redis tiers
      # genuinely distinct, and the stream consumers pinned to one replica. The
      # negative checks in the same script prove the guards still fire.
      - name: Validate every chart in every environment
        run: ./scripts/helm-validate.sh

  terraform:
    name: Terraform
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    # No AWS credentials are configured for this job, on purpose. `validate` and
    # `plan -refresh=false` do not need them, and a job that cannot authenticate
    # cannot be turned into one that applies by a one-line pull request.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          # The wrapper intercepts stdout to expose it as a step output, which
          # breaks any script that reads terraform's output itself -- and it does
          # so by returning empty strings rather than failing.
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Install checkov
        run: pipx install checkov==3.3.19

      # fmt, validate, tflint and checkov, then the assertions that encode this
      # design specifically: that both tiers read the one table-schema file, that
      # the production root keeps PITR, deletion protection, private nodes and a
      # non-public API endpoint, that the sandbox root stays destroyable, that no
      # real account id or state file is committed, and that every IRSA trust
      # policy pins both :sub and :aud.
      - name: Validate every root and module
        run: ./scripts/tf-validate.sh

      # A third layer, and the only one that evaluates the configuration rather
      # than reading it. `validate` type-checks and has no opinion about whether
      # the result is right; tf-validate.sh greps source and so can assert the
      # *absence* of a thing, which `terraform test` structurally cannot; this
      # runs the config against mocked providers and so sees jsondecode, for_each
      # expansion, variable validation, preconditions and module composition.
      # Writing these found a for_each keyed on a value unknown until apply --
      # `validate` passed, and the first real apply would have failed. In a
      # 180-minute disposable session the first apply is the only apply.
      - name: Test every root and module against mocked providers
        run: ./scripts/tf-test.sh

  # A cost estimate is the only review signal in this pipeline that a reader can
  # act on without understanding Terraform. It is a separate job from `terraform`
  # because it is the one check here that depends on a third-party service, and a
  # cost API being down must not be able to fail a correctness gate.
  cost:
    name: Cost
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Infracost needs an API key. This repository has never been pushed, so it
      # has no secrets, and a hard failure here would make the gate un-passable
      # for exactly the reason that has nothing to do with the code. The job
      # announces the skip in the run summary rather than reporting a silent
      # green -- an unconfigured check that looks identical to a passing one is
      # the failure mode this whole project is about.
      - id: key
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${INFRACOST_API_KEY:-}" ]; then
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### Cost estimate skipped"
              echo
              echo "\`INFRACOST_API_KEY\` is not set, so no breakdown was produced."
              echo "This is a **skip, not a pass** — see \`docs/16-gap-register.md\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      # --path on the source tree, not on a plan file: a plan needs credentials
      # and state, and this job has neither on purpose. HCL parsing over-counts
      # anything behind a count/for_each that depends on real data, which for
      # these roots is nothing.
      - if: steps.key.outputs.present == 'true'
        run: |
          set -euo pipefail
          infracost breakdown \
            --path infra/terraform/envs/prod \
            --format table \
            --out-file /tmp/prod-cost.txt
          {
            echo "### Tier P monthly cost"
            echo
            echo '```'
            cat /tmp/prod-cost.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # AIOps (Phase 12).
  #
  # Two things happen here, and only the first one gates.
  #
  #   1. `aiops-selftest.sh` is a correctness gate and blocks. It is offline --
  #      no cluster, no AWS, no model, no network -- so it is fast and cannot
  #      flake. It asserts in both directions: a dangerous plan must raise the
  #      findings, and a safe plan must stay silent.
  #
  #   2. The risk comment is *advisory* and must never fail the build. It is a
  #      second opinion for a human reviewer, and a second opinion that can
  #      block a merge stops being advice. `continue-on-error` is deliberate.
  #
  # The plan it comments on is real: `tf-plan-mock.sh` plans the production root
  # against a LocalStack container, so the module wiring, `for_each` expansion
  # and rendered IAM policy documents are all genuinely evaluated on a runner
  # with no AWS credentials. See `docs/07-aiops.md`.
  aiops:
    name: AIOps
    needs: changes
    if: >-
      needs.changes.outputs.terraform == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Self-test (blocking)
        run: ./scripts/aiops-selftest.sh

      - uses: hashicorp/setup-terraform@v3
        if: github.event_name == 'pull_request'
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      # Only STS, IAM and EC2 are needed; starting the rest costs startup time
      # for services no data source in these roots calls.
      - name: Start LocalStack
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          docker run -d --name tfmock -p 4566:4566 \
            -e SERVICES=sts,iam,ec2 localstack/localstack:3.8
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null; then
              echo "localstack ready"; exit 0
            fi
            sleep 2
          done
          echo "localstack did not become ready" >&2
          exit 1

      - name: Plan the production root
        if: github.event_name == 'pull_request'
        continue-on-error: true
        id: plan
        run: ./scripts/tf-plan-mock.sh infra/terraform/envs/prod /tmp/prod-plan.json

      # Checkov already runs in the `terraform` job as a gate. Re-running it here
      # in JSON form folds its findings into the same comment, so a reviewer
      # reads one list instead of correlating a comment with a log.
      - name: Checkov (report only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          # Pinned, and pinned to the same version the terraform job installs.
          # An unpinned scanner changes its own verdict between runs: the skip
          # comments in the modules were written against a specific ruleset, and
          # a minor bump can add a check nobody chose to adopt.
          pip install --quiet checkov==3.3.19
          checkov -d infra/terraform/envs/prod --compact --quiet \
            -o json --output-file-path /tmp 2>/dev/null || true
          test -f /tmp/results_json.json || echo '{}' > /tmp/results_json.json

      - name: Render the risk comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # Unset in this repository, so the comment renders from the template
          # and says so. A template-only comment is still useful; one that
          # pretended a model wrote it would not be.
          AIOPS_PROVIDER: ${{ vars.AIOPS_PROVIDER || 'none' }}
          AIOPS_API_KEY: ${{ secrets.AIOPS_API_KEY }}
        run: |
          set -euo pipefail
          python3 tools/aiops/risk_comment.py \
            --plan /tmp/prod-plan.json \
            --checkov /tmp/results_json.json \
            --title 'Tier P (production root, never applied)' \
            > /tmp/risk-comment.md
          cat /tmp/risk-comment.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Post or update the comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- aiops:terraform-risk -->';
            let body;
            try {
              body = fs.readFileSync('/tmp/risk-comment.md', 'utf8');
            } catch {
              core.info('no comment was rendered; nothing to post');
              return;
            }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              // Update in place. A new comment per push turns a busy PR into a
              // wall of near-identical tables that reviewers learn to collapse.
              await github.rest.issues.updateComment(
                { owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment(
                { owner, repo, issue_number, body });
            }

      - name: Stop LocalStack
        if: always() && github.event_name == 'pull_request'
        run: docker rm -f tfmock || true

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.java == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The matrix is computed rather than literal so that a frontend-only change does not
        # pay for a full Java database build, which is the expensive half. A literal matrix
        # with per-step `if` guards would still spend a runner and still report a green check
        # for an analysis that never ran -- worse than skipping, because it looks like proof.
        language: >-
          ${{ fromJson(
            (needs.changes.outputs.java == 'true' || needs.changes.outputs.ci == 'true')
            && (needs.changes.outputs.web == 'true' || needs.changes.outputs.ci == 'true')
              && '["java-kotlin","javascript-typescript"]'
            || (needs.changes.outputs.java == 'true'
              && '["java-kotlin"]'
            || '["javascript-typescript"]')
          ) }}
    steps:
      - uses: actions/checkout@v4

      # CodeQL requires GitHub Advanced Security on a PRIVATE repository. Without
      # it, `codeql-action/init` does not skip -- it errors, and since `verdict`
      # needs this job, CI would be permanently red for a reason that has nothing
      # to do with the code. The same argument as the `cost` job, and the same
      # resolution: skip, and say so loudly in the run summary, because an
      # unconfigured gate that renders identically to a passing one is the exact
      # failure this project catalogues. Public repositories get CodeQL free, so
      # this branch is a private-repo concession and is labelled as one.
      - id: ghas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}" \
               --jq '.security_and_analysis.advanced_security.status' 2>/dev/null |
             grep -q enabled; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            {
              echo "### :warning: SAST did not run"
              echo
              echo "CodeQL needs GitHub Advanced Security on a private repository,"
              echo "and it is not enabled. **No static analysis was performed.**"
              echo
              echo "This is a **skip, not a pass.** Make the repository public"
              echo "(CodeQL is free there) or enable Advanced Security."
              echo
              echo "Recorded as class S45 in \`docs/16-gap-register.md\`."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - if: matrix.language == 'java-kotlin' && steps.ghas.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - if: steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality over the default: this is a portfolio repository, and the
          # quality queries catch the class of bug -- unread field, ignored return value --
          # that a reviewer notices and a default CodeQL run does not.
          queries: security-and-quality

      - if: matrix.language == 'java-kotlin' && steps.ghas.outputs.available == 'true'
        run: ./gradlew classes testClasses --no-build-cache

      - if: matrix.language != 'java-kotlin' && steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/autobuild@v3

      - if: steps.ghas.outputs.available == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  # --------------------------------------------------------------------------
  # Images. Built once here and reused by every job that needs them, because
  # building the same image twice is both slow and a correctness risk: the two
  # copies can differ, and then the thing that was scanned is not the thing
  # that was tested.
  # --------------------------------------------------------------------------

  images:
    name: Image (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: ./gradlew :services:${{ matrix.service }}:bootJar

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          # Loaded into the local daemon rather than pushed. Publication happens once, from
          # main, in release.yml -- a pull request must be able to build and scan an image
          # without being able to publish one.
          load: true
          tags: starling/${{ matrix.service }}:ci
          build-args: |
            SERVICE=${{ matrix.service }}
            JAR_FILE=services/${{ matrix.service }}/build/libs/${{ matrix.service }}.jar
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # Runs the image: refreshes the context, opens a real TLS connection, proves the CDS
      # archive maps and that there is no shell. This is the check the whole jlink approach
      # depends on -- jdeps cannot see reflective loading, and the AWS SDK is full of it, so
      # a module set that satisfies the compiler can still produce a container that dies on
      # its first call.
      - name: Verify
        run: ./scripts/image-verify.sh starling/${{ matrix.service }}:ci

      - name: Size gate
        run: ./scripts/image-report.sh starling/${{ matrix.service }}:ci

      # Not aquasecurity/trivy-action: it installs the scanner by running
      # contrib/install.sh from aquasecurity/trivy@main, so pinning the action
      # pins a wrapper around a branch that moves. That script started exiting 1
      # with no diagnostic and took all five image jobs with it. The script below
      # runs a pinned scanner image and is the same command a developer runs
      # locally. The scan fails the build: one that only reports is one nobody reads.
      - name: Vulnerability scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/image-scan.sh \
            starling/${{ matrix.service }}:ci \
            trivy-${{ matrix.service }}.sarif

      - name: Publish scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}
        continue-on-error: true

  # --------------------------------------------------------------------------
  # The product, through a browser, against the images. The slowest job and
  # the last line of defence: every defect found in Phase 4 was invisible to
  # everything above this point.
  # --------------------------------------------------------------------------

  e2e:
    name: End to end
    needs: changes
    if: >-
      needs.changes.outputs.java == 'true' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.docker == 'true' ||
      needs.changes.outputs.compose == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # `make up-app` builds the jars, builds all six images and blocks on
      # tools/wait-for-stack.sh -- the same readiness definition a developer gets locally.
      # Nothing about this job is CI-specific, which is the point: a green pipeline and a
      # working `make up-app` cannot drift apart.
      - name: Bring the stack up
        run: make up-app

      - name: Run the suite
        run: make e2e

      # The same k6 scenario the load harness runs in-cluster, against the compose
      # stack. It is four requests and adds seconds, but it is the only check in CI
      # that exercises register -> login -> post -> timeline as one authenticated
      # flow over HTTP, and it keeps load/lib/flow.js honest: a signature change in
      # the API breaks the load harness here rather than during a rollout drill
      # weeks later, when the failure looks like a canary problem.
      #
      # k6 runs in a container so the job needs no k6 install, and --network host
      # is what lets it reach the 127.0.0.1-bound compose ports.
      - name: Smoke the API with the load harness
        run: |
          docker run --rm --network host \
            -v "$PWD/load:/load" \
            -e BASE_URL=http://localhost:8080 \
            grafana/k6:0.52.0 run /load/smoke.js

      - name: Diagnose a failure
        if: failure()
        run: |
          docker compose --profile app ps
          docker compose --profile app logs --tail 200 \
            gateway user-service tweet-service timeline-service fanout-worker web

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/**
            web/test-results/**
          retention-days: 7
          if-no-files-found: ignore

  # --------------------------------------------------------------------------

  verdict:
    name: CI
    if: always()
    needs: [changes, java, web, secrets, scripts, docs, helm, terraform, cost, aiops, codeql, images, e2e]
    runs-on: ubuntu-latest
    steps:
      # The single required check for branch protection. Listing the individual jobs there
      # instead would make every path-filtered skip look like a missing check and block the
      # merge -- and adding a job would silently leave it unrequired.
      #
      # `changes` is in `needs` deliberately: without it, a failure in change detection
      # would skip every downstream job, and a verdict that treats skipped as passing would
      # then report green for a run that tested nothing at all.
      #
      # Treating anything other than success-or-skipped as a failure also catches
      # 'cancelled', which a `needs.x.result == 'success'` chain does not: a cancelled job
      # is not a passing one.
      - name: Judge
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: ${RESULTS}"
          for r in ${RESULTS}; do
            case "${r}" in
              success|skipped) ;;
              *) echo "::error::a required job reported '${r}'"; exit 1 ;;
            esac
          done
          echo "all required jobs passed or were skipped."
