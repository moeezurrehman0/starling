name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Maintain the release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The progress assertion below asks whether *this* commit bumped the
          # manifest, which is a diff against HEAD~1. The default depth of 1
          # would make that question unanswerable, and -- worse -- answerable
          # as "no", which is the direction that passes.
          fetch-depth: 2

      # Keeps an open PR containing the changelog and the next version, derived
      # from the Conventional Commit history. Merging it tags the release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      # release-please aborts rather than guessing when its two halves of state
      # disagree -- the tracked manifest and the untracked GitHub releases -- and
      # that abort is a warning on a green run, so the job succeeds while nothing
      # is released. See S59.
      #
      # The consistency half of that is necessary and not sufficient: a repository
      # that has never released satisfies it forever, which is the exact shape S59
      # had. The script adds a progress assertion that a repo doing nothing cannot
      # satisfy. See docs/16-gap-register.md S62. Two-sided self-test:
      # scripts/release-verify-selftest.sh.
      - name: Assert the release bookkeeping is consistent and moving
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RELEASES_CREATED: ${{ steps.release.outputs.releases_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: ./scripts/release-verify.sh
