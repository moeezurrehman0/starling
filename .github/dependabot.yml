version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "org.assertj*"
          - "org.mockito*"
      build-tooling:
        patterns:
          - "com.diffplug*"
          - "com.github.spotbugs*"
          - "com.puppycrawl*"
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # Terraform arrives in Phase 8. The block is left commented rather than deleted because
  # Dependabot raises a visible, weekly "no manifests found" error for a directory that does
  # not exist, and a permanently-erroring config is how people learn to ignore the tab.
  # - package-ecosystem: terraform
  #   directory: "/infra/terraform"
  #   schedule:
  #     interval: weekly
  #     day: monday
  #   commit-message:
  #     prefix: "build"

  - package-ecosystem: docker
    # Both Dockerfiles live in docker/ -- the services share one multi-stage build and the
    # frontend has its own. Listing the service directories here found nothing, silently,
    # which is the worst failure mode a dependency bot has: it looks configured.
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
