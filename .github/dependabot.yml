version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "org.assertj*"
          - "org.mockito*"
      build-tooling:
        patterns:
          - "com.diffplug*"
          - "com.github.spotbugs*"
          - "com.puppycrawl*"
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # One entry per root. Dependabot resolves provider constraints against the root's
  # .terraform.lock.hcl, so pointing it at /infra/terraform -- which contains only
  # modules and no lock -- finds nothing and reports success, which is the worst of
  # both outcomes.
  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/sandbox"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/prod"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    # Both Dockerfiles live in docker/ -- the services share one multi-stage build and the
    # frontend has its own. Listing the service directories here found nothing, silently,
    # which is the worst failure mode a dependency bot has: it looks configured.
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
