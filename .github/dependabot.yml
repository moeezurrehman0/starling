version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "org.assertj*"
          - "org.mockito*"
      build-tooling:
        patterns:
          - "com.diffplug*"
          - "com.github.spotbugs*"
          - "com.puppycrawl*"
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # eslint-config-next is released in lockstep with next and has to move with it, but it
      # is a devDependency, so the default grouping puts it in dev-dependencies and next in
      # its own group -- two PRs, neither of which can pass alone. Naming it here keeps the
      # one decision in one place. Grouping is configured by where a dependency sits in the
      # manifest; coupling is a property of the release.
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
      dev-dependencies:
        dependency-type: development
        exclude-patterns:
          - "eslint-config-next"
    ignore:
      # Held deliberately, not overlooked. Both were tried on the Next 16 upgrade and both
      # break the lint step, which is the only thing that reads them:
      #
      #   typescript 7 -- typescript-eslint refuses to load against it outright
      #                   ("typescript-eslint does not support TS 7.0")
      #   eslint 10    -- eslint-plugin-react, pulled in by eslint-config-next, calls a
      #                   context API that ESLint 10 removed
      #
      # Revisit when eslint-config-next ships a dependency set that accepts them; drop the
      # entry rather than pinning around it.
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "eslint"
        versions: [">=10"]
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # One entry per root. Dependabot resolves provider constraints against the root's
  # .terraform.lock.hcl, so pointing it at /infra/terraform -- which contains only
  # modules and no lock -- finds nothing and reports success, which is the worst of
  # both outcomes.
  #
  # The consequence is that a provider bump arrives as a PR that cannot work: the
  # modules restate the same constraint and Dependabot never sees them, so the roots
  # move to ~> 6.66 while seven modules stay on ~> 5.70 and init fails on a version
  # conflict. Adding the module directories here would not fix it either -- they would
  # arrive as seven more PRs, each individually just as broken. tf-validate.sh asserts
  # the constraints agree, so the partial bump fails on a line that says which file is
  # behind; the upgrade itself is a manual, all-nine-files change.
  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/sandbox"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/prod"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    # Both Dockerfiles live in docker/ -- the services share one multi-stage build and the
    # frontend has its own. Listing the service directories here found nothing, silently,
    # which is the worst failure mode a dependency bot has: it looks configured.
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
