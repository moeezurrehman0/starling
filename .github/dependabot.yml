version: 2

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "io.micrometer*"
      testing:
        patterns:
          - "org.junit*"
          - "org.testcontainers*"
          - "org.assertj*"
          - "org.mockito*"
      build-tooling:
        patterns:
          - "com.diffplug*"
          - "com.github.spotbugs*"
          - "com.puppycrawl*"
    commit-message:
      prefix: "build"

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      dev-dependencies:
        dependency-type: development
    commit-message:
      prefix: "build"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"

  # One entry per root. Dependabot resolves provider constraints against the root's
  # .terraform.lock.hcl, so pointing it at /infra/terraform -- which contains only
  # modules and no lock -- finds nothing and reports success, which is the worst of
  # both outcomes.
  #
  # The consequence is that a provider bump arrives as a PR that cannot work: the
  # modules restate the same constraint and Dependabot never sees them, so the roots
  # move to ~> 6.66 while seven modules stay on ~> 5.70 and init fails on a version
  # conflict. Adding the module directories here would not fix it either -- they would
  # arrive as seven more PRs, each individually just as broken. tf-validate.sh asserts
  # the constraints agree, so the partial bump fails on a line that says which file is
  # behind; the upgrade itself is a manual, all-nine-files change.
  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/sandbox"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: terraform
    directory: "/infra/terraform/envs/prod"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"

  - package-ecosystem: docker
    # Both Dockerfiles live in docker/ -- the services share one multi-stage build and the
    # frontend has its own. Listing the service directories here found nothing, silently,
    # which is the worst failure mode a dependency bot has: it looks configured.
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "build"
