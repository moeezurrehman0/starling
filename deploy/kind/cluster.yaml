# Three nodes, because Tier S has three nodes.
#
# A single-node kind cluster hides every scheduling problem there is: topology
# spread is satisfied trivially, a PodDisruptionBudget never blocks anything, and
# a pod that cannot be scheduled anywhere still schedules. Matching the sandbox
# node count is the cheapest way to make Tier L failures predict Tier S failures.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: twitter-clone
networking:
  # kindnet does not implement NetworkPolicy. It accepts the objects, reports
  # them created, and enforces nothing -- so a default-deny policy that is
  # actually wide open looks identical to one that works. Disabling the default
  # CNI forces an explicit choice; scripts/kind-up.sh installs Calico.
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # The web frontend, reachable at http://localhost:8088.
      - containerPort: 30080
        hostPort: 8088
        protocol: TCP
      # ArgoCD, at http://localhost:8089.
      - containerPort: 30081
        hostPort: 8089
        protocol: TCP
  - role: worker
  - role: worker
