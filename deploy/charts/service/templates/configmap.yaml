apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.env }}
  # Quoted unconditionally. An unquoted "true", "8080" or "no" is parsed by YAML
  # as a boolean or an integer, and a ConfigMap value must be a string -- the
  # apply fails with a type error that names the key but not the reason.
  {{ $k }}: {{ $v | quote }}
  {{- end }}
