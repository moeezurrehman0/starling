{{- /*
One template, two kinds.

When canary delivery is on this renders an Argo Rollout instead of a Deployment.
The pod template below is shared verbatim, which is the entire point: the common
alternative — a separate rollout.yaml holding a copy of the pod spec — means the
manifest that actually ships to production is the one nobody edits, and the two
drift the first time a probe or an env var changes in only one of them.

A Rollout is a drop-in replacement for a Deployment: same selector, same pod
template, same scale semantics. Only `spec.strategy` differs.
*/ -}}
{{- $canary := .Values.rollout.enabled -}}
{{- if $canary }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Omitted entirely when an HPA owns this field. Setting it alongside an HPA is
  # the classic GitOps thrash: the HPA scales to 8, ArgoCD sees spec.replicas
  # drift from the 3 in Git, reverts it, the HPA scales back up, and the two
  # fight in a loop that looks like flapping traffic. Kubernetes defaults the
  # field to 1 on create and the HPA raises it to minReplicas within one sync.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 3
  {{- if $canary }}
  strategy:
    canary:
      # Percentage steps with a pause between each. The first step is small and
      # the analysis runs alongside it, so a build that is broken for every
      # request is rejected having served {{ (index .Values.rollout.steps 0).setWeight }}% of traffic rather than all of it.
      #
      # These are *setWeight* steps without a traffic-routing provider, so on
      # Tier L the weight is approximated by replica counts rather than enforced
      # at the proxy. Gap row 32 records the difference: with 2 replicas a 20%
      # step is really 50%. The step list is the Tier P artefact and is not
      # weakened to match what kind can express.
      steps:
      {{- range $i, $step := .Values.rollout.steps }}
        - setWeight: {{ $step.setWeight }}
        - pause: { duration: {{ $step.pause }} }
        {{- if eq $i 0 }}
        # An INLINE analysis step, in addition to the background analysis below.
        # The two are not redundant and the difference is not cosmetic.
        #
        # A background analysis runs alongside the steps and aborts the rollout
        # the moment a metric fails -- good for catching a fast, obvious break.
        # But when the last step finishes, the rollout promotes and *terminates*
        # the background run, and Argo scores a terminated metric as Successful
        # ("Metric Assessment Result - Successful: Run Terminated"). So if the
        # steps finish before the analysis has gathered enough samples, a broken
        # build is promoted and the analysis reports success. That is not a
        # hypothetical: it is what the first run of scripts/rollback-drill.sh
        # actually did. See docs/16-gap-register.md #33.
        #
        # An inline step cannot be outrun. The rollout will not advance past it
        # until the run reaches a terminal state, so the gate holds regardless of
        # how the step durations and the analysis interval line up.
        - analysis:
            templates:
              - templateName: {{ include "service.name" $ }}-canary
            args:
              - name: service
                value: {{ include "service.name" $ }}
              - name: namespace
                value: {{ $.Release.Namespace }}
        {{- end }}
      {{- end }}
      analysis:
        # startingStep 1: the analysis begins *after* the first weight is applied,
        # not before. Starting at step 0 queries Prometheus for a canary that has
        # not received a request yet, and an empty result is inconclusive, which
        # stalls every rollout on a metric that was never going to have data.
        startingStep: 1
        templates:
          - templateName: {{ include "service.name" . }}-canary
        args:
          - name: service
            value: {{ include "service.name" . }}
          - name: namespace
            value: {{ .Release.Namespace }}
  {{- end }}
  selector:
    matchLabels: {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "service.labels" . | nindent 8 }}
      annotations:
        # Roll the pods when configuration changes. Without this, editing the
        # ConfigMap updates the API object and nothing else: envFrom is resolved
        # at pod start, so running pods keep the old values indefinitely and the
        # change appears to have been applied when it has not.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        # Not every workload this chart deploys is a Spring Boot service. The web
        # frontend is Next.js and has no actuator at all, so annotating it for
        # scraping produces a permanent 404 target -- an alert that fires forever
        # about a service that was never going to have metrics.
        {{- if .Values.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: {{ .Values.metrics.path }}
        prometheus.io/port: {{ .Values.port | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "service.name" . }}
      # Pod Security Standards "restricted", stated explicitly rather than
      # inherited from a namespace label. The namespace label enforces it; these
      # fields are what make the pod actually admissible, and having them here
      # means the chart is portable to a cluster whose namespace labels differ.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The image is distroless with no shell, so a graceful shutdown cannot be
      # scripted with a preStop hook. Spring's `server.shutdown: graceful` handles
      # it in-process; this just gives it room before SIGKILL.
      terminationGracePeriodSeconds: 45
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if gt (int (include "service.replicas" .)) 1 }}
      # Spread replicas across nodes, but do not refuse to schedule if that is
      # impossible. ScheduleAnyway matters specifically in Tier S: the playground
      # caps the cluster at three nodes, and DoNotSchedule would leave pods
      # Pending rather than merely unevenly placed.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "service.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ include "service.name" . }}
          image: {{ include "service.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          env:
            - name: JAVA_TOOL_OPTIONS
              # MaxRAMPercentage rather than -Xmx so the heap tracks the memory
              # limit and the two cannot drift apart.
              value: >-
                -XX:MaxRAMPercentage={{ .Values.jvm.maxRamPercentage }}
                {{ .Values.jvm.extraOpts }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: {{ include "service.name" . }}
            {{- if .Values.secretEnv.enabled }}
            - secretRef:
                name: {{ required "secretEnv.secretName is required when secretEnv is enabled" .Values.secretEnv.secretName }}
            {{- end }}
          {{- if .Values.probes.enabled }}
          {{- if .Values.probes.startup.enabled }}
          # A startup probe, not a long initialDelaySeconds. The latter delays
          # liveness detection for the whole life of the pod; this only delays it
          # until the application first answers.
          startupProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.livenessPath }}
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readinessPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # readOnlyRootFilesystem is on, and the JVM still needs somewhere to
            # write: /tmp for hsperfdata and any temp file, and the heap dump
            # path. emptyDir rather than a relaxed root filesystem, because the
            # point of the setting is that a writable path must be a deliberate,
            # enumerated decision.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
