{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.name" . }}
  labels: {{- include "service.labels" . | nindent 4 }}
  {{- if .Values.serviceAccount.roleArn }}
  annotations:
    # IRSA. The pod identity webhook turns this annotation into a projected
    # token and the SDK's web-identity credential provider picks it up with no
    # application change -- which is why gap-register row 9 is a deployment
    # concern and not a code one.
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
  {{- end }}
# No API access is needed by any workload here, so the token is not mounted. It
# is the cheapest possible reduction in blast radius: a compromised pod with a
# mounted token can at minimum enumerate its own namespace.
automountServiceAccountToken: false
{{- end }}
