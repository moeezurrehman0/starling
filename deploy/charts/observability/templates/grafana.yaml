{{- include "observability.guard" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: {{ .Values.namespace }}
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus.{{ .Values.namespace }}.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.{{ .Values.namespace }}.svc.cluster.local:3100
        jsonData:
          # The link that makes the three signals one system instead of three
          # tabs. A log line carrying trace_id becomes a click through to the
          # trace; without it, correlation is copy-and-paste under pressure.
          derivedFields:
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              url: '$${__value.raw}'
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.{{ .Values.namespace }}.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
            tags:
              - key: service.name
                value: app
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: twitterclone
        folder: twitter-clone
        type: file
        # Dashboards are files in the repository, provisioned read-only. Editing
        # one in the UI and not exporting it is how a dashboard becomes something
        # only the person who built it can reproduce -- and this cluster is
        # recreated from scratch several times a day.
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: {{ .Values.namespace }}
data:
{{- range $path, $_ := .Files.Glob "files/dashboards/*.json" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
      annotations:
        # Grafana reads provisioning files at start-up and watches them, but a
        # ConfigMap update reaches the pod as a symlink swap that the watcher
        # misses often enough not to rely on.
        checksum/dashboards: {{ .Files.Glob "files/dashboards/*.json" | toYaml | sha256sum }}
    spec:
      # 472 is the `grafana` user in the upstream image.
      securityContext: {{- include "observability.podSecurityContext" 472 | nindent 8 }}
      containers:
        - name: grafana
          image: {{ .Values.grafana.image }}
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          env:
            # Anonymous, with Admin rights, and no login form. This is a
            # deliberate Tier L choice and one of the sharpest gaps to
            # production: the cluster is on a laptop, reachable only through an
            # explicit port-forward, and a password prompt in a demo that is
            # recreated hourly trains people to use `admin/admin`. Tier P uses
            # Amazon Managed Grafana with IAM Identity Center and no local users
            # at all -- not this with a better password.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true"}
            - {name: GF_AUTH_BASIC_ENABLED, value: "false"}
            # No outbound calls. The plugin catalogue, update checks and usage
            # analytics all reach the internet, which on an air-gapped or
            # rate-limited sandbox turns start-up into a sequence of timeouts.
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: "true"}
            - {name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning}
            # GF_PATHS_DATA defaults to /var/lib/grafana, which is in the image's
            # read-only layer -- Grafana then fails to create grafana.db and exits
            # non-zero before serving anything. Point it at the emptyDir instead of
            # mounting the emptyDir over /var/lib/grafana, so the dashboards
            # ConfigMap below is not shadowed by a nested mount.
            - {name: GF_PATHS_DATA, value: /var/lib/grafana/data}
            - {name: GF_PATHS_PLUGINS, value: /var/lib/grafana/data/plugins}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources: {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - {name: provisioning-datasources, mountPath: /etc/grafana/provisioning/datasources}
            - {name: provisioning-dashboards, mountPath: /etc/grafana/provisioning/dashboards}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards}
            # Grafana writes its SQLite database, sessions and plugin cache under
            # /var/lib/grafana, which readOnlyRootFilesystem otherwise forbids.
            - {name: data, mountPath: /var/lib/grafana/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: provisioning-datasources
          configMap:
            name: grafana-provisioning
            items: [{key: datasources.yaml, path: datasources.yaml}]
        - name: provisioning-dashboards
          configMap:
            name: grafana-provisioning
            items: [{key: dashboards.yaml, path: dashboards.yaml}]
        - {name: dashboards, configMap: {name: grafana-dashboards}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
