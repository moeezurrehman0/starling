{{- include "observability.guard" . }}
{{/*
The collector, and why there is one at all.

Every service here speaks OTLP, and Tempo accepts OTLP directly, so the
applications could export straight to Tempo and this pod could be deleted. It
is kept for three reasons, none of which are visible on a cluster this size and
all of which are the point of building the cluster.

  * It is the single egress target. Each application's NetworkPolicy names one
    destination for telemetry rather than one per backend, so adding a second
    backend -- or swapping Tempo for X-Ray in Tier P -- is a change to this
    deployment and to nothing else. Pointing seven services at a new host is
    seven chances to miss one, and a missed one produces no error.
  * It is where the things you cannot do in a client library go: tail-based
    sampling, which needs the whole trace and therefore cannot be decided by
    the service that starts it; and attribute redaction, which must happen
    before the data leaves the trust boundary rather than inside the agent of
    the team that owns the backend.
  * It absorbs backend restarts. Tempo here is a single replica with no
    persistence; without a buffer in front, every restart drops the spans in
    flight and the gap looks like an application problem.
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        # Small and frequent. The defaults favour throughput over latency, which
        # on a demo cluster means the trace you just generated appears about
        # eight seconds after you have given up looking for it.
        timeout: 2s
        send_batch_size: 512
      memory_limiter:
        # Without this the collector is the component that OOMs first under a
        # load test, and it takes the evidence of the load test with it.
        check_interval: 2s
        limit_percentage: 75
        spike_limit_percentage: 15
      resource:
        attributes:
          - key: deployment.environment
            value: tier-L
            action: upsert
    exporters:
      otlp/tempo:
        endpoint: tempo.{{ .Values.namespace }}.svc.cluster.local:4317
        tls:
          insecure: true
    service:
      telemetry:
        logs:
          level: warn
        metrics:
          # The collector's own metrics, on the port the pod annotation scrapes.
          # A telemetry pipeline that is not itself monitored fails silently by
          # construction: nothing downstream can tell "no traces were produced"
          # from "traces were produced and dropped here".
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          # memory_limiter first, always. It can only shed load it sees before
          # the batcher has already buffered it.
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/tempo]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
        prometheus.io/path: /metrics
    spec:
      securityContext: {{- include "observability.podSecurityContext" 10001 | nindent 8 }}
      containers:
        - name: collector
          image: {{ .Values.collector.image }}
          securityContext: {{- include "observability.containerSecurityContext" . | nindent 12 }}
          args: [--config=/etc/otel/collector.yaml]
          ports:
            - {name: otlp-http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
          readinessProbe:
            # The collector has no readiness endpoint unless the health_check
            # extension is enabled; a TCP probe on the receiver port is the
            # honest alternative, because "the port accepts connections" is
            # exactly as much as an HTTP probe on a 404 would have told us.
            tcpSocket: {port: otlp-http}
            periodSeconds: 5
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/otel}
      volumes:
        - {name: config, configMap: {name: otel-collector}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.appNamespace }}
      ports:
        - {port: 4318, protocol: TCP}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - {port: 8888, protocol: TCP}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tempo
      ports:
        - {port: 4317, protocol: TCP}
