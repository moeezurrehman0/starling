{{- include "dev-infra.guard" . }}
{{- range $n := list "main" "celeb" }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-{{ $n }}
  labels:
    app.kubernetes.io/name: redis-{{ $n }}
spec:
  selector:
    app.kubernetes.io/name: redis-{{ $n }}
  ports:
    # Both caches listen on 6379. In compose they had to differ on the host
    # (6379/6380) because they shared a port namespace; in Kubernetes each has
    # its own Service, so copying the compose host port here is how you end up
    # pointing the celebrity tier at the ordinary cache and observing no error
    # at all -- just a cache that behaves subtly wrong under load.
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-{{ $n }}
  labels:
    app.kubernetes.io/name: redis-{{ $n }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-{{ $n }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-{{ $n }}
    spec:
      # 999 is the `redis` user baked into redis:*-alpine.
      securityContext: {{- include "dev-infra.podSecurityContext" 999 | nindent 8 }}
      containers:
        - name: redis
          image: {{ $.Values.redis.image }}
          securityContext: {{- include "dev-infra.containerSecurityContext" . | nindent 12 }}
          args:
            - --maxmemory
            - {{ (index $.Values.redis $n).maxmemory | quote }}
            - --maxmemory-policy
            - {{ (index $.Values.redis $n).policy | quote }}
            - --appendonly
            - "no"
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
          resources:
            # Headroom above maxmemory: Redis accounts for the dataset, not for
            # fragmentation, replication buffers or the COW pages a fork leaves
            # behind. A limit set to maxmemory gets OOM-killed by the kernel long
            # before Redis ever applies its own eviction policy, so the policy
            # above would never run.
            requests: {cpu: 50m, memory: {{ if eq $n "main" }}384Mi{{ else }}224Mi{{ end }}}
            limits: {memory: {{ if eq $n "main" }}384Mi{{ else }}224Mi{{ end }}}
{{- end }}
