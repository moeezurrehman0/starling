{{- include "dev-infra.guard" . }}
apiVersion: v1
kind: Service
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
spec:
  selector:
    app.kubernetes.io/name: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  labels:
    app.kubernetes.io/name: localstack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: localstack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localstack
    spec:
      securityContext: {{- include "dev-infra.podSecurityContext" 1000 | nindent 8 }}
      containers:
        - name: localstack
          image: {{ .Values.localstack.image }}
          securityContext: {{- include "dev-infra.containerSecurityContext" . | nindent 12 }}
          env:
            - {name: SERVICES, value: {{ .Values.localstack.services | quote }}}
            - {name: DEBUG, value: "0"}
          ports:
            - containerPort: 4566
          readinessProbe:
            httpGet:
              # /_localstack/health, not /health. The latter answers 200 before
              # DynamoDB is actually accepting requests, so the services start,
              # fail their first table call, and crash-loop for reasons that look
              # like application bugs.
              path: /_localstack/health
              port: 4566
            periodSeconds: 5
            failureThreshold: 30
          # Writable state, owned by fsGroup. Without these, a non-root LocalStack
          # cannot write /var/lib/localstack and degrades to a lazy-loaded service
          # index -- it still answers, and still reports Ready, so the only symptom
          # is a slower first call and a stack trace nobody reads.
          volumeMounts:
            - {name: state, mountPath: /var/lib/localstack}
            - {name: tmp, mountPath: /tmp}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
