# Deliberately not installable in Tier P.
#
# Every object here is a single replica with emptyDir storage, which is correct
# for a disposable cluster and catastrophic anywhere else: a pod reschedule
# silently discards the data. The guard below makes "someone pointed the prod
# ArgoCD app at this chart" a template error instead of a data-loss incident.
tier: dev

# Which of the three backing services to install.
#
# This chart used to be all-or-nothing, and that coarseness is what produced the
# defect this flag exists to fix. Tier S needs the caches -- there is no
# ElastiCache in the playground -- but it does *not* need LocalStack or the
# Postgres pod, because `terraform apply` has just created nine real DynamoDB
# tables and an RDS instance. Bundling all three behind one switch meant the
# only way to get Redis in the sandbox was to also get a DynamoDB impersonator,
# and once it was running, every service was pointed at it. The sandbox would
# then have authenticated to AWS through IRSA and spoken to a pod that ignores
# credentials entirely. See the tier table's rows 6, 6b and 7, which state
# plainly that Tier S uses real DynamoDB, real RDS and in-cluster Redis --
# a combination the old flag could not express.
components:
  redis: true
  postgres: true
  localstack: true

# Two caches, deliberately configured differently. The values mirror compose.yaml
# exactly; see the comments there and ADR-0013 for why the policies differ.
#
# Drift between these and compose is the specific risk: both stacks would work,
# and Tier L would stop predicting what the sandbox does under memory pressure --
# which is the only condition where the difference shows up at all.
redis:
  image: redis:8.2-alpine
  main:
    maxmemory: 256mb
    # Profiles, timeline fragments and rate-limit counters: all reconstructible,
    # so evicting the coldest key is correct. Redis defaults to noeviction, which
    # turns a full cache into write errors on the rate limiter.
    policy: allkeys-lru
  celeb:
    maxmemory: 128mb
    # A small, bounded, enormously hot working set. LRU is the wrong instinct:
    # evicting a celebrity's recent-tweet list pushes fan-out-on-read straight
    # onto DynamoDB for millions of readers at once. volatile-ttl evicts only
    # keys that already carry an expiry.
    policy: volatile-ttl
postgres:
  image: postgres:17-alpine
  db: starling_search
  user: starling
  password: starling
localstack:
  image: localstack/localstack:3.8
  services: dynamodb,s3
