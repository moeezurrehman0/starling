# Tier S gateway. Identical to the dev gateway except for the header: it holds no
# AWS endpoints, so nothing here changes between LocalStack and real AWS. It is
# the entry point and the only workload that autoscales, which the sandbox uses
# for the HPA scale-out drill on real EKS (gap register row 5).
name: gateway
port: 8080

image:
  repository: ghcr.io/moeezurrehman0/starling/gateway
  tag: sha-ee23865000c2d0e0b3d7c44716c3353083bafa57

networkPolicy:
  # The web frontend is the only in-cluster caller; the Ingress controller lives
  # in its own namespace and is admitted by the ingress rule below. `k6` is the
  # load-test Job (scripts/load-test.sh), which runs in-cluster rather than
  # through a port-forward so that it actually traverses the Service and the
  # endpoint set the HPA is about to change.
  allowFrom: [web, k6]
  allowTo: [user-service, tweet-service, timeline-service, redis-main]

# The gateway is the only workload that autoscales in the sandbox. It is the entry
# point, so it sees every request and is the first thing to saturate; scaling the
# whole mesh on a 6 vCPU node group would exhaust the cluster before it
# demonstrated anything.
#
# minReplicas is 2, not 1, deliberately: an HPA whose floor is a single pod
# cannot distinguish "scaled out" from "recovered from having no redundancy", and
# the scale-down drill would take the service to one replica and call it success.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  # 60%, below the 70% default. Container CPU throttling starts biting well
  # before the average reaches the limit, so a target set at the point of pain
  # scales out only once users are already feeling it.
  targetCPUUtilizationPercentage: 60

# Canary delivery, on so the drill is rehearsable. The steps are short: the point
# is to demonstrate that the analysis aborts a bad build, and a 20-minute rollout
# does not make that demonstration more convincing, only slower — and the session
# is 180 minutes.
rollout:
  enabled: true
  steps:
    - { setWeight: 20, pause: 1m }
    - { setWeight: 50, pause: 1m }
    - { setWeight: 100, pause: 30s }
  analysis:
    # A shorter window than prod. The drill has to fit the session budget, and the
    # trade-off is explicit: a 1m window is noisier, so this gate is more likely to
    # flag a blip. Prod keeps the 2m default.
    lookback: 1m
    initialDelay: 1m
    count: 4

ingress:
  enabled: false

env:
  REDIS_MAIN_HOST: redis-main
  REDIS_MAIN_PORT: "6379"
  USER_SERVICE_URL: http://user-service:8081
  TWEET_SERVICE_URL: http://tweet-service:8082
  TIMELINE_SERVICE_URL: http://timeline-service:8083
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  # On in the cluster, where the limiter should actually be exercised.
  RATE_LIMIT_ENABLED: "true"
