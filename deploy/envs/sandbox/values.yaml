# Tier S — the KodeKloud EKS sandbox. Real AWS, not LocalStack.
#
# This overlay exists because for a long time it did not, and Tier S ran the
# `dev` overlay instead. That overlay is Tier L: it points every service at an
# in-cluster LocalStack (DYNAMODB_ENDPOINT) and an in-cluster Postgres pod
# (SEARCH_DB_URL). scripts/sandbox-up.sh applied deploy/argocd/root.yaml with
# env=dev, so the sandbox stood up nine real DynamoDB tables, a real RDS
# instance, a real S3 bucket and IRSA roles — and then every pod talked to
# LocalStack and ignored all of it. ArgoCD reported Synced and Healthy while the
# infrastructure the session had just paid for was never touched. This is S78.
#
# The giveaway was in sandbox-up.sh itself: it writes *empty* AWS keys into
# starling-secrets on purpose, so the SDK's provider chain falls through to the
# IRSA web-identity token. Empty credentials for IRSA are meaningless against an
# endpoint that authenticates nothing — LocalStack accepts any credentials or
# none. The manifest and the script were describing two different worlds, and the
# manifest won at runtime.
#
# What this overlay changes from dev, and only this: no DYNAMODB_ENDPOINT (so the
# SDK resolves the real regional endpoint), no in-cluster SEARCH_DB_URL (RDS is
# injected after apply), NetworkPolicy egress that can actually leave the cluster,
# and an ALB Ingress instead of nginx. Everything else — images, ports, service
# wiring, JWKS URIs, rollout config, resources — is dev's, because those are the
# parts Tier S is meant to prove unchanged.
#
# gap register rows 6 (real DynamoDB), 6b (real RDS db.t3.micro), 7 (in-cluster
# Redis on emptyDir) describe what this tier is. Until this file, the manifests
# contradicted the register and the register was right.

image:
  # GHCR, same as dev. Tier P uses ECR; the sandbox cannot, because ECR needs a
  # durable registry and an IAM role the playground wipes each session. Gap
  # register row 4.
  repository: ghcr.io/moeezurrehman0/starling

replicaCount: 1

# One replica at the env level, as dev. No PDB is rendered (the pdbWanted helper
# suppresses it below two replicas), which is correct for a disposable cluster:
# a PDB with minAvailable on a single-replica workload blocks node drain forever.
podDisruptionBudget:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 512Mi

# Off at the env level, exactly as dev. The node group is 3 x t3.medium (6 vCPU),
# and the runbook drives an HPA scale-out demo on the gateway alone; turning
# autoscaling on for the whole mesh would exhaust the node group before it
# demonstrated anything. The per-service files decide who autoscales.
autoscaling:
  enabled: false

serviceAccount:
  # Empty on purpose. Per-service IRSA role ARNs are a Tier P property: each is
  # an output of `terraform apply` and is not knowable when this file is written.
  # In Tier S there is no per-service IRSA — the pods fall back to the shared node
  # instance role, which gap register row 9 records rather than pretends
  # otherwise. Setting a fabricated ARN here would annotate the service account
  # with a role that does not exist and every AWS call would fail assuming it.
  roleArn: ""

networkPolicy:
  enabled: true
  # This is what reaches DynamoDB, S3 and STS. Those are external endpoints in
  # Tier S — real regional services, not in-cluster pods — so egress has to be
  # able to leave the cluster at all. The chart's rule for this deliberately
  # excludes 169.254.169.254/32, the EC2 instance metadata service, so a pod
  # cannot borrow the node instance role's credentials and defeat IRSA. See the
  # networkpolicy template.
  allowExternalEgress: true
  # allowExternalEgress is not "everything outside the cluster": it also excludes
  # the three RFC1918 ranges, so a rule meant to reach DynamoDB does not also hand
  # every pod a route to every private address in the VPC. That exclusion is
  # correct and it has exactly one victim. The KodeKloud playground uses the
  # default VPC, 172.31.0.0/16, which is inside 172.16.0.0/12 — so RDS sits at a
  # private address the rule above forbids, and the search indexer would be handed
  # a password for a host the NetworkPolicy will not let it contact. Nothing in
  # that failure names the policy; it is a connection timeout. This re-admits the
  # default VPC and nothing wider.
  allowCidrs:
    - 172.31.0.0/16

secretEnv:
  enabled: true
  # Applied directly by scripts/sandbox-up.sh, same name as dev and prod. This is
  # where the apply outputs arrive — SEARCH_DB_URL, SEARCH_DB_PASSWORD,
  # DYNAMODB_TABLE_PREFIX — and where the empty AWS keys live so the SDK falls
  # through to the IRSA token. In Tier P the identical Secret name is projected by
  # External Secrets Operator from Secrets Manager, so no workload manifest
  # differs between the two.
  secretName: starling-secrets
