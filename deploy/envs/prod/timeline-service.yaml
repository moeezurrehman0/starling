name: timeline-service
port: 8083

image:
  repository: 000000000000.dkr.ecr.eu-central-1.amazonaws.com/starling/timeline-service
  tag: sha-0000000

serviceAccount:
  roleArn: arn:aws:iam::000000000000:role/starling-prod-timeline-service

networkPolicy:
  allowFrom: [gateway]
  allowTo: [tweet-service, user-service]

env:
  AWS_REGION: eu-central-1
  DYNAMODB_TABLE_PREFIX: prod-
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  # Two separate ElastiCache clusters, which is the production form of the
  # celebrity split: a hot-key storm on a celebrity fan-out cannot evict the
  # working set of ordinary users, because it is not the same memory. In dev the
  # two are just two Redis pods, so the isolation is structural but the capacity
  # argument is untestable — gap-register row 6.
  REDIS_MAIN_HOST: starling-prod-main.xxxx.ng.0001.euc1.cache.amazonaws.com
  REDIS_MAIN_PORT: "6379"
  REDIS_CELEB_HOST: starling-prod-celeb.xxxx.ng.0001.euc1.cache.amazonaws.com
  REDIS_CELEB_PORT: "6379"
  TWEET_SERVICE_URL: http://tweet-service:8082
  USER_SERVICE_URL: http://user-service:8081
