name: tweet-service
port: 8082

image:
  repository: 000000000000.dkr.ecr.eu-central-1.amazonaws.com/twitter-clone/tweet-service
  tag: sha-0000000

serviceAccount:
  roleArn: arn:aws:iam::000000000000:role/twitter-clone-prod-tweet-service

networkPolicy:
  allowFrom: [gateway, timeline-service]
  allowTo: [user-service]
  # RDS and S3 are outside the cluster, so they are covered by the external
  # egress rule rather than by a podSelector.

env:
  AWS_REGION: eu-central-1
  DYNAMODB_TABLE_PREFIX: prod-
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  SEARCH_DB_URL: jdbc:postgresql://twitter-clone-prod.cluster-xxxx.eu-central-1.rds.amazonaws.com:5432/twitter_search
  SEARCH_DB_USER: twitter
  MEDIA_BUCKET: twitterclone-prod-media
  USER_SERVICE_JWKS_URI: http://user-service:8081/v1/jwks
  # Off here too, and it matters more in prod: this Deployment autoscales to 20.
  SEARCH_INDEXER_ENABLED: "false"
  TWEETS_STREAM_ARN: ""
