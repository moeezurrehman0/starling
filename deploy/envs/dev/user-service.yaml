name: user-service
port: 8081

image:
  repository: ghcr.io/moeezurrehman0/starling/user-service
  # Written by CI on merge to main. Never `latest` — the chart refuses it.
  tag: sha-ee15079b3472a15480f5e226b897fa5245139fa0

networkPolicy:
  # Only the gateway and the two services that resolve identity may call this.
  # Nothing in the browser path reaches it directly.
  allowFrom: [gateway, tweet-service, timeline-service]
  # localstack only appears in this tier. In prod DynamoDB is an external endpoint
  # reached through allowExternalEgress, which deliberately excludes every private
  # CIDR -- so locally, where DynamoDB *is* a pod in this namespace, that same rule
  # blocks it and the only symptom is a 5s SDK timeout. See gap register #17.
  allowTo: [localstack]

env:
  AWS_REGION: us-east-1
  DYNAMODB_ENDPOINT: http://localstack:4566
  DYNAMODB_TABLE_PREFIX: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
