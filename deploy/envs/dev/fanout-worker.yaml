# The fan-out worker: a stream consumer with no inbound traffic.
name: fanout-worker
port: 8084

image:
  repository: ghcr.io/moeezurrehman0/starling/fanout-worker
  tag: sha-7d59d03782574c4c1e77491088f5014016470a81

# Single replica for the same reason as the indexer: the consumer does not
# coordinate shard ownership between replicas, so a second pod fans every tweet
# out twice. Making that a property of the deployment rather than of a comment is
# the only reliable protection.
replicaCount: 1

# No Service. Nothing calls it; it reads a stream. Rendering a Service here would
# create a DNS name that resolves to a pod nobody should address, which is how a
# "temporary" direct call gets written six months later.
service:
  enabled: false

networkPolicy:
  allowFrom: []
  # localstack: DynamoDB Streams + tables are in-cluster pods here. See gap register #17.
  allowTo: [localstack]

env:
  AWS_REGION: us-east-1
  DYNAMODB_ENDPOINT: http://localstack:4566
  DYNAMODB_TABLE_PREFIX: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  FANOUT_ENABLED: "true"
  TWEETS_STREAM_ARN: ""
