name: tweet-service
port: 8082

image:
  repository: ghcr.io/twitter-clone/tweet-service
  tag: sha-0000000

networkPolicy:
  allowFrom: [gateway, timeline-service]
  # localstack: DynamoDB + S3 are in-cluster pods in this tier. See gap register #17.
  allowTo: [user-service, postgres, localstack]

env:
  AWS_REGION: us-east-1
  DYNAMODB_ENDPOINT: http://localstack:4566
  DYNAMODB_TABLE_PREFIX: ""
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability:4318
  SEARCH_DB_URL: jdbc:postgresql://postgres:5432/twitter_search
  SEARCH_DB_USER: twitter
  MEDIA_BUCKET: twitterclone-media
  USER_SERVICE_JWKS_URI: http://user-service:8081/v1/jwks
  # OFF, and this is the single most consequential value in this directory.
  #
  # The indexer is a DynamoDB Streams consumer with no coordination between
  # replicas: every replica reads every shard. Two pods therefore index every
  # tweet twice, and an HPA scale-out silently multiplies it. The compose file
  # turns it on because compose runs exactly one container; Kubernetes cannot
  # make that promise, so the indexer runs as its own single-replica Deployment
  # (tweet-indexer.yaml) and the request-serving pods leave it off.
  SEARCH_INDEXER_ENABLED: "false"
  # Left blank deliberately — StreamArns discovers the ARN from the table. A
  # literal would be stale the moment the table is recreated.
  TWEETS_STREAM_ARN: ""
