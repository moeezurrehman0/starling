spring:
  application:
    name: tweet-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fetched and cached, so rotating the key pair in user-service needs no deploy here.
          jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/v1/jwks}
  threads:
    virtual:
      enabled: true
  datasource:
    # Search only. The operational store is DynamoDB (ADR-0011); this database holds one table
    # of derived rows and is rebuildable from the stream, which is why it can be a single
    # instance with no replica and no backup story in any tier.
    url: ${SEARCH_DB_URL:jdbc:postgresql://localhost:5432/twitter_search}
    username: ${SEARCH_DB_USER:twitter}
    password: ${SEARCH_DB_PASSWORD:twitter}
    hikari:
      # Small on purpose. The pool serves search queries and one indexer thread; a large pool
      # in front of a small database converts a slow query into a connection storm.
      maximum-pool-size: ${SEARCH_DB_POOL:10}
      connection-timeout: 3000
  flyway:
    # Run at startup rather than as a job. There is exactly one writer of this schema and the
    # migration creates derived structures, so the usual objection to migrating from the app --
    # several replicas racing on a shared operational schema -- is answered by Flyway's own
    # advisory lock and by the fact that a failed migration here loses nothing.
    enabled: true
    default-schema: search
    # Flyway's own bookkeeping table belongs in the schema it manages, not in public.
    schemas: search

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # The readiness group is listed explicitly so that `stream` joins it. Boot's default
      # readiness group is readinessState alone -- every other HealthIndicator lands in
      # liveness and in the composite, which is the wrong place for this one: a consumer
      # that cannot find its stream must be taken out of service, not restarted. Restarting
      # it does not make the stream appear, and a CrashLoopBackOff would replace a diagnosable
      # condition with a pod nobody can exec into.
      group:
        readiness:
          include: readinessState,stream
          # OUT_OF_SERVICE maps to DOWN for the group so the probe actually fails. Left at
          # the default it reports 200 with a status of OUT_OF_SERVICE in the body, which
          # Kubernetes does not read -- a not-ready pod that stays in the Service.
          status:
            http-mapping:
              out-of-service: 503
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs

twitterclone:
  dynamodb:
    # Tier L only: points the client at LocalStack. Unset everywhere else so the SDK resolves
    # the real regional endpoint from the instance's credentials.
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-prefix: ${DYNAMODB_TABLE_PREFIX:}
  search:
    # Set from the Terraform output for the tweets table's stream. Blank means the indexer does
    # not run, which is the right default for a unit test and for a local run with no stream.
    stream-arn: ${TWEETS_STREAM_ARN:}
    enabled: ${SEARCH_INDEXER_ENABLED:false}
  media:
    bucket: ${MEDIA_BUCKET:twitterclone-media}
    endpoint: ${S3_ENDPOINT:}
    upload-ttl: 10m
    max-bytes: 5242880
