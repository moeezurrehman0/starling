spring:
  application:
    name: fanout-worker
  threads:
    virtual:
      enabled: true

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs

twitterclone:
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-prefix: ${DYNAMODB_TABLE_PREFIX:}
  fanout:
    # Discovered by Terraform and injected; blank means the consumer stays idle rather than
    # guessing at an ARN, because a wrong stream is worse than no stream.
    stream-arn: ${TWEETS_STREAM_ARN:}
    enabled: ${FANOUT_ENABLED:true}
