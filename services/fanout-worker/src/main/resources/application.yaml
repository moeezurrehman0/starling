spring:
  application:
    name: fanout-worker
  threads:
    virtual:
      enabled: true

server:
  port: 8084
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # The readiness group is listed explicitly so that `stream` joins it. Boot's default
      # readiness group is readinessState alone -- every other HealthIndicator lands in
      # liveness and in the composite, which is the wrong place for this one: a consumer
      # that cannot find its stream must be taken out of service, not restarted. Restarting
      # it does not make the stream appear, and a CrashLoopBackOff would replace a diagnosable
      # condition with a pod nobody can exec into.
      group:
        readiness:
          include: readinessState,stream
          # OUT_OF_SERVICE maps to DOWN for the group so the probe actually fails. Left at
          # the default it reports 200 with a status of OUT_OF_SERVICE in the body, which
          # Kubernetes does not read -- a not-ready pod that stays in the Service.
          status:
            http-mapping:
              out-of-service: 503
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish Prometheus histogram buckets for HTTP server timings.
      #
      # Without this Micrometer exports only _count and _sum, so
      # http_server_requests_seconds_bucket does not exist at all and any
      # histogram_quantile() over it returns an empty vector -- forever, and
      # silently. The canary's p95 gate was written against those buckets and
      # could never have fired. See docs/16-gap-register.md #37.
      percentiles-histogram:
        http.server.requests: true
      # Bound the bucket range. An unbounded histogram over a route with high
      # latency variance is a cardinality problem, not an observability win.
      #
      # BOTH bounds are set. Supplying only a maximum is rejected at runtime --
      # Micrometer validates max >= min against a default minimum that is larger
      # than any sensible HTTP maximum, and the resulting
      # InvalidConfigurationException is thrown per request from inside the
      # metrics filter, so the app starts, passes its probes, and then 500s.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 5s
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Spring Boot 4 renamed this from management.otlp.tracing.endpoint. The old
          # key still binds, which is worse than if it did not: a typo or a stale key
          # produces no warning and no spans.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs

starling:
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-prefix: ${DYNAMODB_TABLE_PREFIX:}
  fanout:
    # Discovered by Terraform and injected; blank means the consumer stays idle rather than
    # guessing at an ARN, because a wrong stream is worse than no stream.
    stream-arn: ${TWEETS_STREAM_ARN:}
    enabled: ${FANOUT_ENABLED:true}
