spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true

server:
  port: 8081
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish Prometheus histogram buckets for HTTP server timings.
      #
      # Without this Micrometer exports only _count and _sum, so
      # http_server_requests_seconds_bucket does not exist at all and any
      # histogram_quantile() over it returns an empty vector -- forever, and
      # silently. The canary's p95 gate was written against those buckets and
      # could never have fired. See docs/16-gap-register.md #37.
      percentiles-histogram:
        http.server.requests: true
      # Bound the bucket range. An unbounded histogram over a route with high
      # latency variance is a cardinality problem, not an observability win.
      #
      # BOTH bounds are set. Supplying only a maximum is rejected at runtime --
      # Micrometer validates max >= min against a default minimum that is larger
      # than any sensible HTTP maximum, and the resulting
      # InvalidConfigurationException is thrown per request from inside the
      # metrics filter, so the app starts, passes its probes, and then 500s.
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 5s
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Spring Boot 4 renamed this from management.otlp.tracing.endpoint. The old
          # key still binds, which is worse than if it did not: a typo or a stale key
          # produces no warning and no spans.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs

twitterclone:
  jwt:
    issuer: https://twitterclone.dev
    # Short because nothing revokes a JWT: a logged-out or banned account keeps working for
    # exactly this long. The gateway caches the JWKS, so the cost of a short TTL is a refresh
    # round trip, not a key fetch per request.
    ttl: 15m
    # Absent in Tier L, which generates an ephemeral key at startup and says so loudly.
    # Tiers S and P inject a PEM here from a mounted secret; see the gap register for why
    # that secret is a Kubernetes Secret in S and an External Secrets reference in P.
    signing-key: ${JWT_SIGNING_KEY:}
  dynamodb:
    # Overridden to LocalStack in Tier L. Empty means the default AWS endpoint for the region,
    # which is what S and P want -- so the production path is the one with no configuration.
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-prefix: ${DYNAMODB_TABLE_PREFIX:}
