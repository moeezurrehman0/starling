spring:
  application:
    name: gateway
  # Every proxied request blocks on an upstream. On platform threads the edge would be sized
  # by its slowest downstream; on virtual threads it is sized by memory.
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_MAIN_HOST:localhost}
      port: ${REDIS_MAIN_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${USER_SERVICE_URL:http://localhost:8081}/v1/jwks

twitterclone:
  gateway:
    # Longest prefix wins, so a more specific route can be added without reordering.
    # The [] around every key is mandatory, not a style. Spring Boot's relaxed binding
    # treats a bare map key as a property path and drops any key containing a character
    # that cannot appear in one -- `/` being the obvious example. Without the brackets this
    # map binds to ZERO entries and the gateway answers 404 to everything it should route,
    # silently and with no warning in the log. It is not caught by a unit test that builds
    # GatewayProperties directly; only binding the real file finds it. See RoutePropertiesBindingTest.
    routes:
      "[/v1/jwks]": ${USER_SERVICE_URL:http://localhost:8081}
      "[/v1/sessions]": ${USER_SERVICE_URL:http://localhost:8081}
      "[/v1/users]": ${USER_SERVICE_URL:http://localhost:8081}
      "[/v1/media]": ${TWEET_SERVICE_URL:http://localhost:8082}
      "[/v1/search]": ${TWEET_SERVICE_URL:http://localhost:8082}
      "[/v1/tweets]": ${TWEET_SERVICE_URL:http://localhost:8082}
      "[/v1/timelines]": ${TIMELINE_SERVICE_URL:http://localhost:8083}
    upstream-timeout: ${UPSTREAM_TIMEOUT:5s}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      # Burst covers a client opening a screen, refill is the rate worth sustaining.
      burst: ${RATE_LIMIT_BURST:100}
      refill: ${RATE_LIMIT_REFILL:100}
      period: ${RATE_LIMIT_PERIOD:1s}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          # Spring Boot 4 renamed this from management.otlp.tracing.endpoint. The old
          # key still binds, which is worse than if it did not: a typo or a stale key
          # produces no warning and no spans.
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs
