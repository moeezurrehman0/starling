[versions]
springBoot = "4.1.1"
jspecify = "1.0.1"
testcontainers = "2.0.5"
checkstyle = "14.1.0"
googleJavaFormat = "1.36.1"
spotless = "8.10.2"
spotbugs = "6.5.11"
jacoco = "0.8.13"
archunit = "1.4.1"
# AWS SDK v2. The v1 SDK (group com.amazonaws) reached end of support in Dec 2025
# and must not be introduced — see ADR-0012 on why the KCL streams adapter is rejected.
awsSdk = "2.46.7"

[libraries]
# --- Platforms -------------------------------------------------------------
# Boot 4.1.1 already manages Testcontainers 2.0.5, so no separate BOM is needed.
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "awsSdk" }

# --- Spring Boot 4 modular starters ----------------------------------------
# Boot 4 removed the umbrella starters: there is no spring-boot-starter-web.
boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
# The annotations only, for the shared library module that contributes beans without being
# an application. Pulling a starter there would drag logging and a runtime into a library.
boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
boot-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
boot-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
boot-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
boot-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
boot-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
boot-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
boot-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
boot-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
boot-test = { module = "org.springframework.boot:spring-boot-starter-test" }
# MockMvc post-processors that put an authenticated principal in the SecurityContext. Without
# it, testing a secured controller means either disabling the filter chain -- which stops the
# test from covering the thing most likely to be wrong -- or minting a real signed token.
security-test = { module = "org.springframework.security:spring-security-test" }
# Boot 4 split the test slices out of spring-boot-test-autoconfigure into per-technology
# modules, so @WebMvcTest is no longer on the classpath of spring-boot-starter-test and now
# lives in org.springframework.boot.webmvc.test.autoconfigure.
boot-webmvc-test = { module = "org.springframework.boot:spring-boot-webmvc-test" }
boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# --- Observability ---------------------------------------------------------
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
otel-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# --- Persistence: DynamoDB (operational store, ADR-0011) -------------------
aws-dynamodb = { module = "software.amazon.awssdk:dynamodb" }
aws-dynamodb-enhanced = { module = "software.amazon.awssdk:dynamodb-enhanced" }
# DynamoDbStreamsClient ships inside the dynamodb artifact. The consumer is hand-rolled
# on DescribeStream/GetShardIterator/GetRecords rather than using KCL — see ADR-0012.
aws-s3 = { module = "software.amazon.awssdk:s3" }
aws-apache-client = { module = "software.amazon.awssdk:apache-client" }

# --- Persistence: PostgreSQL (search index only, ADR-0007) -----------------
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# --- Null safety -----------------------------------------------------------
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# --- Test ------------------------------------------------------------------
# Plain JUnit, for modules that have no Spring dependency and should not gain one just to
# be tested. Version comes from the Spring Boot BOM so it stays aligned with boot-test.
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core" }
archunit = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
# Testcontainers 2.x renamed every module to testcontainers-<name>;
# the 1.x coordinates (org.testcontainers:postgresql) no longer resolve.
testcontainers-junit = { module = "org.testcontainers:testcontainers-junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
testcontainers-localstack = { module = "org.testcontainers:testcontainers-localstack" }

# --- Gradle plugin artifacts, for use inside build-logic ------------------
plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
plugin-spotless = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
plugin-spotbugs = { module = "com.github.spotbugs:com.github.spotbugs.gradle.plugin", version.ref = "spotbugs" }

[bundles]
observability = ["micrometer-prometheus", "micrometer-tracing-bridge-otel", "otel-exporter-otlp"]
dynamodb = ["aws-dynamodb", "aws-dynamodb-enhanced", "aws-apache-client"]
search-persistence = ["boot-data-jpa", "postgresql", "flyway-core", "flyway-postgresql"]
testing = ["boot-test", "assertj", "archunit"]
testcontainers = ["boot-testcontainers", "testcontainers-junit", "testcontainers-postgresql", "testcontainers-localstack"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
spotbugs = { id = "com.github.spotbugs", version.ref = "spotbugs" }
