org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# The daemon runs on whatever JDK is available; the build itself targets Java 25
# through a toolchain, downloaded on demand by the foojay resolver.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Fail fast rather than silently resolving a dependency from an unexpected repo.
systemProp.org.gradle.internal.repository.max.retries=2
